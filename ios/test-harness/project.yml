name: LuminaTestHarness
options:
  bundleIdPrefix: com.lumina.test
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]:
      - "$(inherited)"
      - "$(SRCROOT)/../../target/aarch64-apple-ios-sim/release"
    LIBRARY_SEARCH_PATHS[sdk=iphoneos*]:
      - "$(inherited)"
      - "$(SRCROOT)/../../target/aarch64-apple-ios/release"
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    OTHER_LDFLAGS: ["$(inherited)", "-lz", "-liconv", "-lbz2", "-lc++"]

packages:
  LuminaVideoBridge:
    path: ../lumina-video-bridge

targets:
  LuminaTestHarness:
    type: application
    platform: iOS
    sources:
      - LuminaTestHarness
    dependencies:
      - package: LuminaVideoBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumina.test.harness
        INFOPLIST_GENERATION_MODE: GeneratedByXcode
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
  LuminaPlaybackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LuminaPlaybackTests
      - path: ../../fixtures/generated/h264-aac.mp4
        buildPhase: resources
    dependencies:
      - target: LuminaTestHarness
      - package: LuminaVideoBridge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  LuminaTestHarness:
    build:
      targets:
        LuminaTestHarness: all
    test:
      targets:
        - LuminaPlaybackTests
      environmentVariables:
        LUMINA_HARNESS_TESTING: "1"
