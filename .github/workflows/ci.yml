name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, gpui-port, "codex/**"]
  pull_request:
    branches: [main, gpui-port]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: Check runtime smoke driver
        run: python3 scripts/test-smoke-gstreamer-runtime.py
      - name: Check portable workspace dependencies
        shell: python
        run: |
          import json
          import pathlib
          import re
          import subprocess

          for filename in subprocess.check_output(["git", "ls-files", "*Cargo.toml"], text=True).splitlines():
              assert not re.search(r'path\s*=\s*["\']/|path\s*=\s*["\'][A-Za-z]:', pathlib.Path(filename).read_text()), f"absolute path: {filename}"
          metadata = json.loads(subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version", "1"], text=True))
          members = {pathlib.Path(package["manifest_path"]).parent.resolve() for package in metadata["packages"] if package["id"] in metadata["workspace_members"]}
          for package in metadata["packages"]:
              for dependency in package["dependencies"]:
                  if dependency.get("path"):
                      assert pathlib.Path(dependency["path"]).resolve() in members, f"dependency outside workspace: {package['name']}: {dependency['path']}"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap container
        run: pacman -Syu --noconfirm --needed git curl python
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install GStreamer 1.28 and build dependencies
        run: bash scripts/ci-install-linux.sh
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap container
        run: pacman -Syu --noconfirm --needed git curl python
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GStreamer 1.28 and build dependencies
        run: bash scripts/ci-install-linux.sh
      - name: Generate deterministic fixtures
        run: ./fixtures/generate.sh
      - name: Run tests
        run: cargo test --locked --workspace --verbose
      - name: Test MoQ transport and encoded media integration
        run: |
          cargo test --locked --package lumina-video-native-frame --features moq
          cargo test --locked --package lumina-video-native-frame --features moq encoded_av_tracks_decode_through_the_moq_source_bin -- --ignored
          cargo test --locked --package lumina-video-native-frame native_decoder_policy_is_instance_scoped_and_keeps_parsers -- --ignored
          cargo check --locked --package lumina-video-gpui --features moq
      - name: Check GPUI vendored runtime feature
        run: cargo check --locked --package lumina-video-gpui --features vendored-runtime

  test-macos:
    name: Test (macOS, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install FFmpeg build tools
        run: brew install nasm pkg-config
      - name: Build bundled FFmpeg 9 from lock
        run: bash scripts/build-ffmpeg-runtime.sh "$RUNNER_TEMP/lumina-ffmpeg"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.runner }}-ffmpeg-${{ hashFiles('vendor/ffmpeg.lock.json', 'scripts/build-ffmpeg-runtime.sh') }}
      - name: Run tests
        run: cargo test --locked --workspace --verbose

      - name: Check iOS device and simulator ABI
        if: matrix.runner == 'macos-15'
        run: |
          unset SDKROOT
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          cargo check --locked --package lumina-video-ios --target aarch64-apple-ios
          cargo check --locked --package lumina-video-ios --target aarch64-apple-ios-sim
      - name: Check macOS MoQ implementation
        run: cargo check --locked --package lumina-video-gpui --features moq

  check-windows:
    name: Test native video (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test opt-in Media Foundation and GPU import
        run: cargo test --locked --package lumina-video-core --package lumina-video-native-frame --package lumina-video-wgpu --features windows-native-video --all-targets
  check-android:
    name: Check (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android native toolchain
        run: |
          sdkmanager "platforms;android-37.2" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Add Android target
        run: rustup target add aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Check Android native-frame build
        run: cargo ndk -t arm64-v8a check --locked --package lumina-video-core --package lumina-video-native-frame --package lumina-video-wgpu --features android-zero-copy
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build and test Android bridge
        run: gradle --no-daemon -p android :lumina-video-bridge:assembleDebug :lumina-video-bridge:testDebugUnitTest

  test-web:
    name: Test (WebGPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: crates/lumina-video-gpui/web/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: npm ci && npm test && npm run build
        working-directory: crates/lumina-video-gpui/web
      - run: cargo +nightly check --locked -p lumina-video-gpui --target wasm32-unknown-unknown --features moq
      - run: cargo install trunk --locked
      - run: trunk build
        working-directory: crates/lumina-video-gpui/web

  # Summary job for branch protection
  ci-success:
    name: CI Success
    needs: [fmt, clippy, test-linux, test-macos, check-windows, check-android, test-web]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.fmt.result }}" != "success" ]] || \
             [[ "${{ needs.clippy.result }}" != "success" ]] || \
             [[ "${{ needs.test-linux.result }}" != "success" ]] || \
             [[ "${{ needs.test-macos.result }}" != "success" ]] || \
             [[ "${{ needs.check-windows.result }}" != "success" ]] || \
             [[ "${{ needs.check-android.result }}" != "success" ]] || \
             [[ "${{ needs.test-web.result }}" != "success" ]]; then
            echo "Some jobs failed"
            exit 1
          fi
          echo "All required jobs passed!"
