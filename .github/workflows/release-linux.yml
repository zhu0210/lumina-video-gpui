name: Release Linux Bundle

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    uses: ./.github/workflows/package-gstreamer.yml

  upload-release:
    name: Upload tested standalone bundle
    needs: bundle
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: gstreamer-runtime-linux-x86_64
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
