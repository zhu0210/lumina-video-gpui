name: Package locked GStreamer runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/package-gstreamer.yml
      - vendor/gstreamer-1.0.lock.json
      - vendor/ffmpeg.lock.json
      - scripts/cerbero-ffmpeg.recipe
      - scripts/discover-gstreamer-lock.sh
      - scripts/build-gstreamer-runtime.sh
      - scripts/smoke-gstreamer-runtime.sh
      - crates/lumina-video-native-frame/src/vendored_runtime.rs
      - crates/lumina-video-native-frame/src/linux_video.rs
      - crates/lumina-video-native-frame/src/linux_video_gst.rs
      - crates/lumina-video-native-frame/src/moq_decoder.rs
      - fixtures/generate.sh

concurrency:
  group: package-gstreamer-runtime
  cancel-in-progress: false

permissions:
  contents: read

env:
  LOCK_FILE: vendor/gstreamer-1.0.lock.json
  BUILDER_IMAGE: ubuntu@sha256:019e8eb29a85e74d64925745884f2ec79aa27e3feab36353d24656f4d6b89467

jobs:
  package:
    name: Build locked GStreamer 1.28.6 runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ubuntu@sha256:019e8eb29a85e74d64925745884f2ec79aa27e3feab36353d24656f4d6b89467
      options: --platform linux/amd64
    steps:
      - name: Checkout triggering ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install pinned builder prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            autoconf automake autopoint autotools-dev binutils bison build-essential \
            ccache cmake curl flex g++ gettext git gperf jq libasound2-dev \
            libclang-dev libcurl4-openssl-dev libdrm-dev libegl1-mesa-dev \
            libgl1-mesa-dev libglu1-mesa-dev libpulse-dev libssl-dev libtool \
            libva-dev libx11-dev libx11-xcb-dev libxcomposite-dev libxdamage-dev \
            libxext-dev libxfixes-dev libxi-dev libxrandr-dev libxrender-dev \
            libxtst-dev libxv-dev make nasm ninja-build pkg-config python3 \
            python3-distro \
            python3-dev python3-pip python3-setuptools python3-venv x11proto-record-dev \
            xutils-dev xz-utils

      - name: Verify builder identity
        run: |
          test "$(. /etc/os-release && echo "$VERSION_ID")" = 24.04
          ldd --version | sed -n '1p' | grep -F '2.39'
          test "$BUILDER_IMAGE" = "$(jq -r '.builder.image' "$LOCK_FILE")"

      - name: Build from lock (fetch, then offline package)
        run: |
          mkdir -p artifacts
          ./scripts/build-gstreamer-runtime.sh --lock "$LOCK_FILE" --output artifacts

      - name: Upload standalone artifact and hashes
        uses: actions/upload-artifact@v4
        with:
          name: gstreamer-runtime-linux-x86_64
          path: artifacts/
          if-no-files-found: error

  smoke:
    name: Smoke standalone runtime in a clean container
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout triggering ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: gstreamer-runtime-linux-x86_64
          path: artifacts

      - name: Generate deterministic MP4 fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg jq
          ./fixtures/generate.sh

      - name: Run isolated GStreamer smoke
        run: |
          ./scripts/smoke-gstreamer-runtime.sh \
            artifacts/gstreamer-runtime-linux-x86_64.tar.gz \
            "$LOCK_FILE" \
            fixtures/generated/h264-aac.mp4
