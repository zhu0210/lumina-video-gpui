name: Package audited GStreamer runtime

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - .github/workflows/package-gstreamer.yml
      - vendor/gstreamer-1.0.lock.json
      - vendor/cerbero-overlay/**
      - scripts/discover-gstreamer-lock.sh
      - scripts/build-gstreamer-runtime.sh
      - scripts/audit-gstreamer-runtime.sh
      - scripts/gstreamer-shared-library-inventory.py
      - scripts/test-gstreamer-runtime-shared-libraries.sh
      - scripts/smoke-gstreamer-runtime.sh
      - scripts/run-gstreamer-smoke-case.sh
      - flatpak/io.github.lumina_video.Demo.yml
      - fixtures/generate.sh

concurrency:
  group: package-audited-gstreamer-runtime
  cancel-in-progress: false

permissions:
  contents: read

env:
  LOCK_FILE: vendor/gstreamer-1.0.lock.json
  BUILDER_IMAGE: ubuntu@sha256:019e8eb29a85e74d64925745884f2ec79aa27e3feab36353d24656f4d6b89467
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0

jobs:
  package:
    name: Build and audit locked runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ubuntu@sha256:019e8eb29a85e74d64925745884f2ec79aa27e3feab36353d24656f4d6b89467
      options: --platform linux/amd64
    steps:
      - name: Checkout triggering ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install pinned builder prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            autoconf automake autopoint autotools-dev binutils bison build-essential \
            ca-certificates ccache cmake curl flex g++ gettext git gperf jq libasound2-dev \
            libclang-dev libcurl4-openssl-dev libdrm-dev libegl1-mesa-dev \
            libgl1-mesa-dev libglu1-mesa-dev libpipewire-0.3-dev libpulse-dev \
            libssl-dev libtool libva-dev libx11-dev libx11-xcb-dev libxcomposite-dev \
            libxdamage-dev libxext-dev libxfixes-dev libxi-dev libxrandr-dev \
            libxrender-dev libxtst-dev libxv-dev make nasm ninja-build patch pkg-config \
            python3 python3-distro python3-dev python3-pip python3-setuptools \
            python3-venv unzip x11proto-record-dev xutils-dev xz-utils

      - name: Verify builder identity
        run: |
          test "$(. /etc/os-release && echo "$VERSION_ID")" = 24.04
          ldd --version | sed -n '1p' | grep -F '2.39'
          test "$BUILDER_IMAGE" = "$(jq -r '.builder.image' "$LOCK_FILE")"

      - name: Test fail-closed shared-library inventory
        run: ./scripts/test-gstreamer-runtime-shared-libraries.sh

      - name: Build from lock (fetch, then offline package)
        run: |
          mkdir -p artifacts
          ./scripts/build-gstreamer-runtime.sh --lock "$LOCK_FILE" --output artifacts

      - name: Audit runtime and corresponding source bundle
        run: |
          ./scripts/audit-gstreamer-runtime.sh \
            artifacts/gstreamer-runtime-linux-x86_64.tar.xz \
            artifacts/gstreamer-runtime-linux-x86_64.sources.tar.xz \
            "$LOCK_FILE"

      - name: Upload standalone runtime, source, inventory and hashes
        uses: actions/upload-artifact@v4
        with:
          name: gstreamer-runtime-linux-x86_64
          path: artifacts/
          if-no-files-found: error

  smoke:
    name: Smoke runtime matrix in clean containers
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout triggering ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download audited runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: gstreamer-runtime-linux-x86_64
          path: artifacts

      - name: Generate deterministic fixture matrix
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg jq openssl python3
          ./fixtures/generate.sh

      - name: Run isolated MP4/Matroska/WebM/dual-track/HLS/audio matrix
        run: |
          ./scripts/smoke-gstreamer-runtime.sh \
            artifacts/gstreamer-runtime-linux-x86_64.tar.xz \
            "$LOCK_FILE" \
            fixtures/generated

  flatpak:
    name: Build Flatpak from the audited runtime tarball
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout triggering ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download standalone runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: gstreamer-runtime-linux-x86_64
          path: artifacts

      - name: Install Flatpak 25.08 builder and fixture prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder ffmpeg jq openssl python3

      - name: Install Flatpak 25.08 toolchain
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Record actual OSTree commits as build provenance
        run: |
          platform_commit=$(flatpak info --system --show-commit org.freedesktop.Platform//25.08)
          sdk_commit=$(flatpak info --system --show-commit org.freedesktop.Sdk//25.08)
          rust_commit=$(flatpak info --system --show-commit org.freedesktop.Sdk.Extension.rust-stable//25.08)
          jq -n --arg platform "$platform_commit" --arg sdk "$sdk_commit" --arg rust "$rust_commit" \
            '{runtime: "org.freedesktop.Platform", runtime_version: "25.08", platform_ostree_commit: $platform, sdk_ostree_commit: $sdk, rust_extension_ostree_commit: $rust, note: "provenance only; manifest does not permanently pin user runtimes"}' \
            > artifacts/flatpak-provenance.json

      - name: Build Flatpak with the same audited runtime tarball
        run: |
          cp artifacts/gstreamer-runtime-linux-x86_64.tar.xz flatpak/
          flatpak-builder --force-clean --repo=repo flatpak-build flatpak/io.github.lumina_video.Demo.yml
          flatpak build-bundle repo lumina-video-demo.flatpak io.github.lumina_video.Demo

      - name: Generate the same deterministic fixture matrix
        run: |
          ./fixtures/generate.sh

      - name: Run the same matrix inside the Flatpak launcher
        run: |
          flatpak install --user -y --bundle lumina-video-demo.flatpak
          ./scripts/smoke-gstreamer-runtime.sh \
            --flatpak-app io.github.lumina_video.Demo \
            "$LOCK_FILE" \
            fixtures/generated

      - name: Upload Flatpak and provenance
        uses: actions/upload-artifact@v4
        with:
          name: lumina-video-demo-flatpak
          path: |
            lumina-video-demo.flatpak
            artifacts/flatpak-provenance.json
          if-no-files-found: error
