app-id: io.github.lumina_video.Demo
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: lumina-video-demo

# PulseAudio is the only host audio socket. PipeWire is represented by the
# audited native closure/presence checks; XDG_RUNTIME_DIR is not passed through.
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --socket=pulseaudio

modules:
  # The exact audited runtime tarball is shared with standalone packaging.
  # The workflow copies this file beside the manifest before flatpak-builder.
  - name: lumina-audited-gstreamer-runtime
    buildsystem: simple
    build-commands:
      - tar -xJf gstreamer-runtime-linux-x86_64.tar.xz -C /app
      - test -x /app/vendor/linux-x86_64/bin/lumina-gstreamer-runtime
      - test -f /app/runtime-manifest.json
    sources:
      - type: file
        path: gstreamer-runtime-linux-x86_64.tar.xz

  # Demo binary packaging remains deliberately small; the runtime above owns
  # all GStreamer libraries and the launcher contract.
  - name: lumina-video-demo
    buildsystem: simple
    build-commands:
      - install -Dm755 lumina-video-demo /app/bin/lumina-video-demo.bin
      - |
        cat > /app/bin/lumina-video-demo <<'EOF'
        #!/bin/sh
        exec /app/vendor/linux-x86_64/bin/lumina-gstreamer-runtime /app/bin/lumina-video-demo.bin "$@"
        EOF
        chmod 0755 /app/bin/lumina-video-demo
    sources:
      - type: file
        path: lumina-video-demo
