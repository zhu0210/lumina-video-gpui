app-id: io.github.lumina_video.Demo
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: lumina-video-demo

# PulseAudio is the only host audio socket. PipeWire is represented by the
# audited native closure/presence checks; XDG_RUNTIME_DIR is not passed through.
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --socket=pulseaudio

modules:
  # The exact audited runtime tarball is shared with standalone packaging.
  # The workflow copies this file beside the manifest before flatpak-builder.
  - name: lumina-audited-gstreamer-runtime
    buildsystem: simple
    build-commands:
      - tar -xJf gstreamer-runtime-linux-x86_64.tar.xz -C /app
      - test -x /app/vendor/linux-x86_64/bin/lumina-gstreamer-runtime
      - test -f /app/runtime-manifest.json
    sources:
      - type: file
        path: gstreamer-runtime-linux-x86_64.tar.xz

  # Build the demo inside the declared 25.08 SDK/rust-stable extension. The
  # source tree and Cargo.lock are the only Cargo inputs; no host binary is
  # copied into the sandbox. Network is granted only to this SDK build so the
  # SDK can materialize a lock-pinned Cargo vendor directory before switching
  # Cargo itself to offline mode.
  - name: lumina-video-demo
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
      env:
        CARGO_BUILD_JOBS: '2'
        CARGO_INCREMENTAL: '0'
        CARGO_NET_OFFLINE: 'false'
        CARGO_TARGET_DIR: /run/build/lumina-video-demo/target
    build-commands:
      - |
        mkdir -p .cargo
        cargo vendor --locked /run/build/lumina-video-demo/cargo-vendor > .cargo/config.toml
        CARGO_NET_OFFLINE=true cargo build --release --locked --package lumina-video-demo
      - install -Dm755 /run/build/lumina-video-demo/target/release/lumina-video-demo /app/bin/lumina-video-demo.bin
      - |
        cat > /app/bin/lumina-video-demo <<'EOF'
        #!/bin/sh
        exec /app/vendor/linux-x86_64/bin/lumina-gstreamer-runtime /app/bin/lumina-video-demo.bin "$@"
        EOF
        chmod 0755 /app/bin/lumina-video-demo
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .git/**
          - target
          - target/**
          - dist
          - dist/**
          - artifacts
          - artifacts/**
          - .flatpak-builder
          - .flatpak-builder/**
          - flatpak/*.tar.xz
