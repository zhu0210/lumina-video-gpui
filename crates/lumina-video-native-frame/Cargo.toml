[package]
name = "lumina-video-native-frame"
version = { workspace = true }
edition = "2021"
description = "Native video frames, legacy decoders, and the headless player"
repository = "https://github.com/lumina-video/lumina-video"
license = "MIT OR Apache-2.0"
keywords = ["multimedia", "video", "zero-copy"]
categories = ["multimedia", "rendering"]

[dependencies]
lumina-video-core = { path = "../lumina-video-core" }
bytemuck = { version = "1.14", features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }
url = "2.5"

# Native-only runtime dependencies (not available on wasm32)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossbeam-channel = "0.5"
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-rustls = { workspace = true }
hyper-util = { workspace = true }
parking_lot = { workspace = true }
poll-promise = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true }

# MoQ (Media over QUIC) transport and Nostr discovery.
async-channel = { version = "2.0", optional = true }
bytes = { version = "1.5", optional = true }
hang = { version = "=0.20.10", optional = true }
moq-net = { version = "=0.2.18", optional = true }
moq-native = { version = "=0.19.16", optional = true }
nostr-sdk = { version = "0.45.2", optional = true }
quinn = { version = "0.11", optional = true }

# Android native decoder + zero-copy
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["game-activity"] }
ash = { version = "0.38" }
jni = { workspace = true }
libc = { version = "0.2" }
ndk = { version = "0.9", features = ["api-level-26", "media"] }
ndk-context = "0.1"
ndk-sys = { version = "0.6" }
opus = { workspace = true }
symphonia-codec-aac = { workspace = true }
symphonia-core = { workspace = true }
webpki-roots = { workspace = true }

# iOS native AVFoundation/VideoToolbox decoder + zero-copy
[target.'cfg(target_os = "ios")'.dependencies]
block2 = { workspace = true }
dispatch2 = "0.3"
objc2 = { workspace = true }
objc2-av-foundation = { workspace = true }
objc2-core-foundation = {
  version = "0.3",
  features = ["CFDictionary", "CFNumber", "CFString"]
}
objc2-core-media = { workspace = true }
objc2-core-video = { workspace = true }
objc2-foundation = { workspace = true }
objc2-video-toolbox = { workspace = true }
profiling = { version = "1.0" }

# Linux GStreamer-based video decoder + zero-copy
[target.'cfg(target_os = "linux")'.dependencies]
ash = { version = "0.38" }
gio = { workspace = true }
drm-fourcc = { version = "2.2" }
gstreamer = { version = "0.25.3" }
gstreamer-allocators = { version = "0.25" }
gstreamer-app = { version = "0.25.2", features = ["v1_24"] }
gstreamer-video = { version = "0.25", features = ["v1_24"] }
libc = { version = "0.2" }
opus = { workspace = true }
symphonia-codec-aac = { workspace = true }
symphonia-core = { workspace = true }

# macOS native AVFoundation/VideoToolbox decoder + zero-copy
[target.'cfg(target_os = "macos")'.dependencies]
block2 = { workspace = true }
cpal = { workspace = true }
ffmpeg-next = { workspace = true }
objc2-metal = { workspace = true }
objc2 = { workspace = true }
objc2-av-foundation = { workspace = true }
objc2-core-foundation = {
  version = "0.3",
  features = ["CFDictionary", "CFNumber", "CFString"]
}
objc2-core-media = { workspace = true }
objc2-core-video = { workspace = true }
objc2-foundation = { workspace = true }
objc2-video-toolbox = { workspace = true }
opus = { workspace = true }
profiling = { version = "1.0" }
symphonia-codec-aac = { workspace = true }
symphonia-core = { workspace = true }

# Windows native Media Foundation decoder
[target.'cfg(target_os = "windows")'.dependencies]
profiling = { version = "1.0", optional = true }
rodio = {
  version = "0.22.2",
  default-features = false,
  features = ["playback", "symphonia-all"],
  optional = true
}
windows = {
  version = "0.62.2",
  features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
  ],
  optional = true
}

[features]
default = []
vendored-runtime = []
windows-native-video = ["profiling", "rodio", "windows", "zero-copy"]
zero-copy = []
android-zero-copy = []
moq = [
  "async-channel",
  "bytes",
  "hang",
  "moq-net",
  "moq-native",
  "nostr-sdk",
  "quinn",
]

[lints.rust]
unexpected_cfgs = {
  level = "warn",
  check-cfg = [
    "cfg(feature, values(\"android-zero-copy\", \"cargo-clippy\", \"moq\", \"vendored-runtime\", \"zero-copy\", \"windows-native-video\"))"
  ]
}
