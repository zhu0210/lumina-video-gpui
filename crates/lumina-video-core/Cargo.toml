[package]
name = "lumina-video-core"
version = { workspace = true }
edition = "2021"
description = "Framework-neutral video and media-session semantics"
repository = "https://github.com/lumina-video/lumina-video"
license = "MIT OR Apache-2.0"
keywords = ["hardware-acceleration", "multimedia", "video", "zero-copy"]
categories = ["multimedia", "rendering"]

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
url = "2.5"

# Native-only network and synchronization dependencies (not available on wasm32)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-rustls = { workspace = true }
hyper-util = { workspace = true }
parking_lot = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true }

# The platform-independent audio API owns the cpal output implementation for
# the platforms where it is available. Decoder-specific dependencies belong to
# lumina-video-native-frame.
[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "android"))'.dependencies]
cpal = { workspace = true }

[features]
default = []
