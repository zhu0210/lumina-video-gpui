[package]
name = "lumina-video-demo"
version = "0.2.2"
edition = "2021"
description = "Demo application for lumina-video (GPUI-based video player)"
publish = false

[[bin]]
name = "lumina-video-demo"
path = "src/main.rs"

[dependencies]
gpui_wgpu = {
  git = "https://github.com/zhu0210/zed.git",
  rev = "3f6222154558bfb2d4d763ff3500c5b4c815173a"
}
lumina-video-gpui = { path = "../lumina-video-gpui" }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# =========================================================================
# Platform backends — all three must use the wgpu-renderer backend.
#
# wgpu  : enables GpuContextHandle, surface(), Window::gpu_context(),
#         SurfaceSource variants, WgpuTextureNv12 scene primitives.
#         Required on gpui for ALL platforms.
#
# wgpu-renderer : switches the platform crate from its native renderer
#         (Metal on macOS, DirectX on Windows) to gpui_wgpu::WgpuRenderer.
#         Required on gpui_macos and gpui_windows.
#         Linux (gpui_linux) ALWAYS uses WgpuRenderer — no toggle needed.
# =========================================================================

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui = {
  git = "https://github.com/zhu0210/zed.git",
  rev = "3f6222154558bfb2d4d763ff3500c5b4c815173a",
  features = [
    "wgpu",    # GpuContextHandle + surface() element
    "wayland", # Wayland display server protocol
    "x11",     # X11 display server protocol
  ]
}
gpui_linux = {
  git = "https://github.com/zhu0210/zed.git",
  rev = "3f6222154558bfb2d4d763ff3500c5b4c815173a",
  features = [
    "wayland", # pulls in gpui_wgpu, wayland-client, etc.
    "x11",     # pulls in gpui_wgpu, x11rb, etc.
  ]
}

[target.'cfg(target_os = "macos")'.dependencies]
gpui = {
  git = "https://github.com/zhu0210/zed.git",
  rev = "3f6222154558bfb2d4d763ff3500c5b4c815173a",
  features = [
    "wgpu",     # GpuContextHandle + surface() element
    "font-kit", # font-kit text system (macOS default)
  ]
}
gpui_macos = {
  git = "https://github.com/zhu0210/zed.git",
  rev = "3f6222154558bfb2d4d763ff3500c5b4c815173a",
  features = [
    "wgpu-renderer", # switches from Metal renderer → WgpuRenderer
    "font-kit",       # font-kit text system
  ]
}

[target.'cfg(target_os = "windows")'.dependencies]
gpui = {
  git = "https://github.com/zhu0210/zed.git",
  rev = "3f6222154558bfb2d4d763ff3500c5b4c815173a",
  features = [
    "wgpu", # GpuContextHandle + surface() element
    # text system: gpui_wgpu::CosmicTextSystem (from wgpu-renderer),
    # NOT font-kit / DirectWrite
  ]
}
gpui_windows = {
  git = "https://github.com/zhu0210/zed.git",
  rev = "3f6222154558bfb2d4d763ff3500c5b4c815173a",
  features = [
    "wgpu-renderer", # switches from DirectX renderer → WgpuRenderer
  ]
}

[features]
# Windows still requires explicit feature flag
windows-native-video = ["lumina-video-gpui/windows-native-video"]
vendored-runtime = ["lumina-video-gpui/vendored-runtime"]
moq = ["lumina-video-gpui/moq"]
