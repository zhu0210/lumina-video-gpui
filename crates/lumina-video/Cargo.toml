[package]
name = "lumina-video"
version = { workspace = true }
edition = "2021"
description = "Cross-platform video playback for GPUI with hardware acceleration"
repository = "https://github.com/lumina-video/lumina-video"
license = "MIT OR Apache-2.0"
keywords = ["gpui", "hardware-acceleration", "multimedia", "video", "wgpu"]
categories = ["gui", "multimedia", "rendering"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-linux-android",
]

[dependencies]
# Legacy native player/frame/backend implementation.
lumina-video-native-frame = { path = "../lumina-video-native-frame" }
lumina-video-core = { path = "../lumina-video-core" }

# GPUI composition boundary.
lumina-video-gpui = { path = "../lumina-video-gpui" }
lumina-video-wgpu = { path = "../lumina-video-wgpu" }

# Utilities
bytemuck = { version = "1.14", features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }
url = "2.5"

# Native-only dependencies (not available on wasm32)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossbeam-channel = "0.5"
http-body-util = { workspace = true }
# HTTP streaming (browser uses native fetch APIs instead)
hyper = { workspace = true }
hyper-rustls = { workspace = true }
hyper-util = { workspace = true }
# Threading
parking_lot = { workspace = true }
# Async promises with tokio backend
poll-promise = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
lumina-video-gst = { path = "../lumina-video-gst" }

# Web/WASM video playback using browser APIs
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3" }
wasm-bindgen = { version = "0.2" }
wasm-bindgen-futures = { version = "0.4" }
web-sys = {
  version = "0.3",
  features = [
    "CodecState",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "EncodedVideoChunk",
    "EncodedVideoChunkInit",
    "EncodedVideoChunkType",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlMediaElement",
    "HtmlVideoElement",
    "MediaError",
    "Node",
    "TimeRanges",
    # WebCodecs API for MoQ decoder
    "VideoDecoder",
    "VideoDecoderConfig",
    "VideoDecoderInit",
    "VideoDecoderSupport",
    "VideoFrame",
    "Window",
    "console",
  ]
}
# wgpu for WebGPU zero-copy texture operations (must match GPUI's wgpu)
wgpu = { workspace = true }

[features]
default = []

# Windows: Native Media Foundation + DXVA2/D3D11VA hardware acceleration
windows-native-video = [
  "lumina-video-native-frame/windows-native-video",
  "lumina-video-gpui/windows-native-video",
  "lumina-video-wgpu/windows-native-video",
]

# Vendored runtime: Bundle GStreamer libraries with the binary (Linux only)
# This eliminates the need for users to install GStreamer system packages.
# The vendored libraries are loaded from `vendor/linux-x86_64/lib/` relative to the executable.
# LGPL compliance: See vendor/README.md for source availability and relinking instructions.
vendored-runtime = ["lumina-video-native-frame/vendored-runtime"]

# Android: opt-in NDK ImageReader zero-copy bridge.
android-zero-copy = ["lumina-video-native-frame/android-zero-copy"]

# MoQ: Media over QUIC live streaming transport
moq = [
  "lumina-video-native-frame/moq",
  "lumina-video-gpui/moq"
]

[lints.rust]
unexpected_cfgs = {
  level = "warn",
  check-cfg = [
    "cfg(feature, values(\"cargo-clippy\", \"windows-native-video\", \"moq\", \"android-zero-copy\"))"
  ]
}
