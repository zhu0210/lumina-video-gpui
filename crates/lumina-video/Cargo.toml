[package]
name = "lumina-video"
version = { workspace = true }
edition = "2021"
description = "Cross-platform video playback for GPUI with hardware acceleration"
repository = "https://github.com/lumina-video/lumina-video"
license = "MIT OR Apache-2.0"
keywords = ["gpui", "hardware-acceleration", "multimedia", "video", "wgpu"]
categories = ["gui", "multimedia", "rendering"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-linux-android",
]

[dependencies]
# Core decode pipeline (framework-independent and wgpu-free)
lumina-video-core = { path = "../lumina-video-core" }
lumina-video-wgpu = { path = "../lumina-video-wgpu" }

# GPUI UI integration
# "wgpu" is opt-in (not in default features) — required for GpuContextHandle, surface(), etc.
gpui = {
  path = "../../../zed/crates/gpui",
  features = ["wgpu"]
}
# gpui_wgpu for wgpu types (single wgpu version shared with core)
gpui_wgpu = {
  path = "../../../zed/crates/gpui_wgpu"
}

# Utilities
bytemuck = { version = "1.14", features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }
url = "2.5"

# Native-only dependencies (not available on wasm32)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossbeam-channel = "0.5"
http-body-util = { workspace = true }
# HTTP streaming (browser uses native fetch APIs instead)
hyper = { workspace = true }
hyper-rustls = { workspace = true }
hyper-util = { workspace = true }
# Threading
parking_lot = { workspace = true }
# Async promises with tokio backend
poll-promise = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true }

# MoQ (Media over QUIC) transport dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.quinn]
version = "0.11"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.moq-lite]
git = "https://github.com/kixelated/moq"
rev = "baabd55c7a8dd6c85d6e1e329a776208bd1107ca"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.moq-native]
git = "https://github.com/kixelated/moq"
rev = "baabd55c7a8dd6c85d6e1e329a776208bd1107ca"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.hang]
git = "https://github.com/kixelated/moq"
rev = "baabd55c7a8dd6c85d6e1e329a776208bd1107ca"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.async-channel]
version = "2.0"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.bytes]
version = "1.5"
optional = true

# Nostr client for MoQ stream discovery (NIP-53 Live Activities)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.nostr-sdk]
version = "0.37"
optional = true

# Web/WASM video playback using browser APIs
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3" }
wasm-bindgen = { version = "0.2" }
wasm-bindgen-futures = { version = "0.4" }
web-sys = {
  version = "0.3",
  features = [
    "CodecState",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "EncodedVideoChunk",
    "EncodedVideoChunkInit",
    "EncodedVideoChunkType",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlMediaElement",
    "HtmlVideoElement",
    "MediaError",
    "Node",
    "TimeRanges",
    # WebCodecs API for MoQ decoder
    "VideoDecoder",
    "VideoDecoderConfig",
    "VideoDecoderInit",
    "VideoDecoderSupport",
    "VideoFrame",
    "Window",
    "console",
  ]
}
# wgpu for WebGPU zero-copy texture operations (must match GPUI's wgpu)
wgpu = { workspace = true }

[features]
default = []

# Windows: Native Media Foundation + DXVA2/D3D11VA hardware acceleration
windows-native-video = [
  "lumina-video-core/windows-native-video",
  "lumina-video-wgpu/windows-native-video"
]

# Vendored runtime: Bundle GStreamer libraries with the binary (Linux only)
# This eliminates the need for users to install GStreamer system packages.
# The vendored libraries are loaded from `vendor/linux-x86_64/lib/` relative to the executable.
# LGPL compliance: See vendor/README.md for source availability and relinking instructions.
vendored-runtime = ["lumina-video-core/vendored-runtime"]

# MoQ: Media over QUIC live streaming transport
moq = [
  "async-channel",
  "bytes",
  "hang",
  "moq-lite",
  "moq-native",
  "nostr-sdk",
  "quinn"
]

[lints.rust]
unexpected_cfgs = {
  level = "warn",
  check-cfg = [
    "cfg(feature, values(\"cargo-clippy\", \"windows-native-video\", \"moq\", \"android-zero-copy\"))"
  ]
}
