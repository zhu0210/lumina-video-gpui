[package]
name = "lumina-video"
version = { workspace = true }
edition = "2021"
description = "Cross-platform video playback for GPUI with hardware acceleration"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lumina-video/lumina-video"
keywords = ["gpui", "video", "multimedia", "wgpu", "hardware-acceleration"]
categories = ["gui", "multimedia", "rendering"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-linux-android",
]

[dependencies]
# Core decode + zero-copy pipeline (egui-free, uses same wgpu as GPUI)
lumina-video-core = { path = "../lumina-video-core" }

# GPUI — the UI framework (replaces egui)
# "wgpu" is opt-in (not in default features) — required for GpuContextHandle, surface(), etc.
gpui = { git = "https://github.com/zhu0210/zed.git", branch = "gpui_wgpu_backend", features = ["wgpu"] }
# gpui_wgpu for wgpu types (single wgpu version shared with core)
gpui_wgpu = { git = "https://github.com/zhu0210/zed.git", branch = "gpui_wgpu_backend" }

# Utilities
bytemuck = { version = "1.14", features = ["derive"] }
tracing = { workspace = true }
thiserror = { workspace = true }
url = "2.5"

# Native-only dependencies (not available on wasm32)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Threading
parking_lot = { workspace = true }
crossbeam-channel = "0.5"
# Async promises with tokio backend
poll-promise = { workspace = true }
# HTTP streaming (browser uses native fetch APIs instead)
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
hyper-rustls = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true }

# MoQ (Media over QUIC) transport dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.quinn]
version = "0.11"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.moq-lite]
git = "https://github.com/kixelated/moq"
rev = "baabd55c7a8dd6c85d6e1e329a776208bd1107ca"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.moq-native]
git = "https://github.com/kixelated/moq"
rev = "baabd55c7a8dd6c85d6e1e329a776208bd1107ca"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.hang]
git = "https://github.com/kixelated/moq"
rev = "baabd55c7a8dd6c85d6e1e329a776208bd1107ca"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.async-channel]
version = "2.0"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.bytes]
version = "1.5"
optional = true

# Nostr client for MoQ stream discovery (NIP-53 Live Activities)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.nostr-sdk]
version = "0.37"
optional = true

# Web/WASM video playback using browser APIs
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2" }
wasm-bindgen-futures = { version = "0.4" }
js-sys = { version = "0.3" }
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlVideoElement",
    "HtmlMediaElement",
    "HtmlCanvasElement",
    "MediaError",
    "TimeRanges",
    "CssStyleDeclaration",
    "Node",
    "console",
    # WebCodecs API for MoQ decoder
    "VideoDecoder",
    "VideoDecoderConfig",
    "VideoDecoderInit",
    "VideoDecoderSupport",
    "VideoFrame",
    "EncodedVideoChunk",
    "EncodedVideoChunkInit",
    "EncodedVideoChunkType",
    "CodecState",
] }
# wgpu for WebGPU zero-copy texture operations (must match GPUI's wgpu)
wgpu = { workspace = true }

[features]
default = []

# Windows: Native Media Foundation + DXVA2/D3D11VA hardware acceleration
windows-native-video = []

# MoQ: Media over QUIC live streaming transport
moq = ["async-channel", "bytes", "hang", "moq-lite", "moq-native", "nostr-sdk", "quinn"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(feature, values(\"cargo-clippy\", \"windows-native-video\"))"] }
