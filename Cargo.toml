[workspace]
package.version = "0.2.2"
resolver = "2"
members = [
  "crates/lumina-video",
  "crates/lumina-video-core",
  "crates/lumina-video-demo",
  # "crates/lumina-video-android",    # TODO: port to GPUI
  # "crates/lumina-video-ios",
  # "crates/lumina-video-web-demo",   # TODO: port to GPUI
]

[workspace.dependencies]
# wgpu — must match zed's version exactly for Arc<wgpu::Texture> type compatibility
wgpu = "30.0.0"
# wgpu-hal for zero-copy platform import
wgpu-hal = "30.0.0"

# Video/audio dependencies
cpal = "0.16"
ffmpeg-next = "8.0"
opus = "0.3"
symphonia-codec-aac = "0.5"
symphonia-core = "0.5"

crossbeam-channel = "0.5"
parking_lot = "0.12"
# Async/threading
poll-promise = { version = "0.3.0", features = ["tokio"] }

http-body-util = "0.1.3"
# HTTP streaming
hyper = { version = "1.7.0", features = ["full"] }
hyper-rustls = {
  version = "0.27.7",
  default-features = false,
  features = ["http1", "http2", "native-tokio", "ring", "webpki-roots"]
}
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = {
  version = "0.23.28",
  default-features = false,
  features = ["ring", "std", "tls12"]
}
tokio = { version = "1.16", features = ["fs", "macros", "rt-multi-thread"] }
webpki-roots = "1.0"

bytemuck = { version = "1.14", features = ["derive"] }
thiserror = "2.0.7"
# Utilities
tracing = { version = "0.1.40", features = ["log"] }

# Android
jni = "0.21.1"

block2 = "0.6"
# metal-rs for zero-copy IOSurface → Metal texture import
metal = "0.31"
# macOS native video decoding (VideoToolbox HW acceleration)
objc2 = "0.6"
objc2-av-foundation = {
  version = "0.3",
  features = [
    "AVAsset",
    "AVAssetReader",
    "AVAssetReaderOutput",
    "AVAssetTrack",
    "AVMediaFormat",
    "objc2-core-foundation",
    "objc2-core-media",
    "objc2-core-video"
  ]
}
objc2-core-media = {
  version = "0.3",
  features = [
    "CMFormatDescription",
    "CMSampleBuffer",
    "CMTime",
    "CMTimeRange",
    "objc2",
    "objc2-core-video"
  ]
}
objc2-core-video = {
  version = "0.3",
  features = [
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
    "objc2"
  ]
}
objc2-foundation = {
  version = "0.3",
  features = [
    "NSArray",
    "NSDate",
    "NSDictionary",
    "NSError",
    "NSRunLoop",
    "NSString",
    "NSURL",
    "NSValue"
  ]
}
objc2-video-toolbox = "0.3"

[patch.crates-io]
async-process = {
  git = "https://github.com/zed-industries/async-process.git",
  rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d"
}
async-task = {
  git = "https://github.com/smol-rs/async-task.git",
  rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e"
}
calloop = { git = "https://github.com/zed-industries/calloop" }
libwebrtc = {
  git = "https://github.com/zed-industries/livekit-rust-sdks",
  rev = "c3a55bbc207008f1ca3474b6037fdd3c443cad0f"
}
livekit = {
  git = "https://github.com/zed-industries/livekit-rust-sdks",
  rev = "c3a55bbc207008f1ca3474b6037fdd3c443cad0f"
}
notify = {
  git = "https://github.com/zed-industries/notify",
  rev = "faecbc33db4f59313e5225ef766bfd9e54a54cfd"
}
notify-types = {
  git = "https://github.com/zed-industries/notify",
  rev = "faecbc33db4f59313e5225ef766bfd9e54a54cfd"
}
webrtc-sys = {
  git = "https://github.com/zed-industries/livekit-rust-sdks",
  rev = "c3a55bbc207008f1ca3474b6037fdd3c443cad0f"
}
windows-capture = {
  git = "https://github.com/zed-industries/windows-capture.git",
  rev = "f0d6c1b6691db75461b732f6d5ff56eed002eeb9"
}

[profile.small]
inherits = "release"
opt-level = "z"
strip = true
lto = true
panic = "abort"
codegen-units = 1

# NOTE: objc2 0.5.x (winit) and 0.6.x (AVFoundation) coexist because they use different ObjC classes.
# The Objective-C runtime handles dispatch correctly for both versions.
